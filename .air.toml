root = "."
tmp_dir = "tmp/air"

[build]
  pre_cmd = [
    "echo '🔍 Dependency Check'",
    "echo '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'",
    "if [ -f go.work ]; then echo '✅ Using go.work workspace:'; awk '{gsub(/\\r/, \"\"); gsub(/^[[:space:]]+|[[:space:]]+$/, \"\"); if (practice == \"\" || practice ~ /^go / || practice == \"use (\" || practice == \")\") next; sub(/^use /, \"\"); if (practice == \".\") practice = \"zen-desktop (main)\"; print \"  📦 \" practice}' go.work; else echo '⚠️  No go.work found'; fi",
    "echo ''",
    "echo '📝 go.mod replace directives:'",
    "grep '^replace ' go.mod 2>/dev/null | sed 's/^/  ⚠️  ACTIVE: /' || echo '  ✅ None active'",
    "if grep -q '^//.*replace ' go.mod 2>/dev/null; then echo '  💬 Commented out:'; grep '^//.*replace ' go.mod | sed 's|^//replace |    |'; fi",
    "echo '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\\n'"
  ]
  cmd = "go build -tags fts5 -o zen-mcp ./cmd/zen"
  bin = "zen-mcp"
  args_bin = []
  include_ext = ["go", "mod", "sum", "yaml", "yml", "toml"]
  exclude_dir = ["assets", "tmp", "npm", "vendor", "frontend/node_modules", "build", "internal/cfg/data"]
  exclude_file = ['yaml']
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = false
  stop_on_error = false
  delay = 4000
  kill_delay = 1000

[log]
  time = true
  main_only = true
  silent = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = false
