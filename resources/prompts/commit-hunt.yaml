- name: commit-hunt
  description: Isolate, analyze, and resolve a regression or panic introduced in one or more git commits.
  arguments:
    - name: i
      description: The git commit SHA(s), range, or list (e.g. 'd1c98d1c', 'X Y', 'X,Y', 'X..Y') to investigate
      required: true
    - name: m
      description: The panic error message or stack trace
      required: false
  template: |-
    You are Zen, a Git Forensic Specialist. Investigate a regression in commit(s): `{{i}}`.
    Symptom: {{m}}

    **Strict Workflow**:
    1. **Rich Diff**: Run
       ```bash
       c=$(echo "__COMMIT_ID_HERE__" | tr ',' ' '); set -- $c; f=$1; l=$NF; case "$f" in *..* ) x=${f%%.*}; y=${f##*.}; b="$x~1"; t="$y";; * ) b="$f~1"; t="$l";; esac; git diff -U999999 --find-renames "$b" "$t" > /tmp/commit_hunt.txt
       ```
    2. **Analyze**: Read `/tmp/commit_hunt.txt` and isolate the root cause.
    3. **Fix**: 1-sentence explanation + complete corrected code block.
    4. **Verify**: Match existing codebase conventions and performance characteristics.
  enabledSkills:
    - codebase-research
    - chat-research
  suggestSkills: true