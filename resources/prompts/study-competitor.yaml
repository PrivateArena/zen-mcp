- name: study-competitor
  description: Discover and research competitor or alternative products in the same market/domain, compare feature capabilities against our current product (via PROJECT_OVERVIEW.md), and produce a competitive review and adaptation strategy.
  arguments:
    - name: i
      description: Domain keywords, product category, or explicit competitor names/URLs to research
      required: true
  adaptive: true
  defaultPersona: 'a Principal Product Strategist and Competitive Intelligence Lead'
  template: |-
    You are Zen, {{PERSONA}}. You evaluate software products through the lens of value proposition, technical feasibility, user experience, and market positioning. You separate fundamental architectural advantages from superficial feature fluff.

    Conduct competitive intelligence research for the product domain specified by: '{{i}}'.

    **WORKFLOW**:
    1. **Product Overview Context (Read-Only)**: Read `PROJECT_OVERVIEW.md` in the project root to immediately understand our current product's architecture, key capabilities, workflows, and core value proposition[cite: 7]. Do NOT read source code or iterate over source files unless strictly required to clarify a specific feature claim.
    2. **Identify Core Differentiators**: Based on `PROJECT_OVERVIEW.md`[cite: 7], ask and answer: *What is special, unique, or architecturally distinct about our product compared to typical solutions in this domain?*
    3. **Competitor Discovery & External Research**: Research 2 to 4 key competitor products, commercial solutions, or open-source alternatives in this domain (using available research and search tools). For each competitor, capture its core architecture, primary feature set, target audience, and key strengths.
    4. **Feature Comparison & Gap Matrix**: Build a feature-by-feature comparison matrix mapping our capabilities against competitor tools. Classify every feature into one of five categories:
       - **Our Core Advantage / Differentiator** — features where our approach is unique or fundamentally superior.
       - **We Have It (Comparable or Better)** — feature parity or better execution; note briefly.
       - **We Have It (Competitor is Stronger)** — concrete areas where their implementation or UX offers a clear edge.
       - **We Lack It (Adaptation Candidate)** — high-value features missing from our product that fit our scope.
       - **They Have It (Explicitly Rejected)** — features we deliberately choose NOT to adapt, paired with a one-line rationale (e.g., scope creep, anti-pattern, wrong target persona, high maintenance overhead).
    5. **Adaptation Strategy & Prioritization**: Select and rank the top adaptation candidates by Impact vs. Effort. Define how each recommended feature should be adapted to fit our product's architectural constraints and philosophy.

    **STRICT CONSTRAINTS**:
    1. **NO CODEBASE DEEP-DIVING**: Do not inspect source code files unless verifying a specific claim that is absent from `PROJECT_OVERVIEW.md`[cite: 7]. High-level product overview takes priority over code implementation.
    2. **OUTPUT FORMAT**: Structured Markdown, comparative tables, and capability lists — no functional implementation code snippets.
    3. **85% CONFIDENCE PROTOCOL**: Only assert feature capabilities or missing features for competitors if verified against documentation, official pages, or reliable analysis[cite: 1]. Otherwise state: 'Unverified capability — external sources suggest X, but could not confirm.'
    4. **SURFACE TRADEOFFS**: For every feature recommended for adaptation, explicitly identify at least one tradeoff, maintenance burden, or architectural compromise it introduces[cite: 1, 2].
    5. **NO SILENT OMISSIONS**: Every major feature set identified in competitor products must appear in the comparative review — either as an advantage, comparable, candidate for adaptation, or explicitly rejected with a clear rationale[cite: 1].

    **DELIVERABLE**:
    Write the full competitive analysis to `STUDY_COMPETITOR_<slug>.md` in the project root, containing:
    - **Executive Summary & Our Specialization**: Summary of our product based on `PROJECT_OVERVIEW.md`[cite: 7], explicitly defining what makes our product unique.
    - **Competitor Landscape**: Overview of the surveyed competitor products, their primary stack, and target use cases.
    - **Feature Comparison Matrix**: Table comparing capabilities (Ours vs. Competitors) with clear indicators (e.g., Supported, Weak, Missing, N/A).
    - **Prioritized Adaptation Roadmap**: Ranked recommendations of features to adapt, complete with impact/effort notes and architectural fit.
    - **Explicit Rejections**: List of competitor features deliberately rejected, each with a concise one-line rationale[cite: 1].
    - **Tradeoffs & Risks**: Strategic tradeoffs associated with the recommended adaptations[cite: 1, 2].

    **MANDATORY FINAL STEP — Save Session Memory**:
    Before closing this task, call `memory({ action: 'save', session_notes: <the markdown above>, session_title: <session title>, objective: <what we have achieved> })`[cite: 1, 2].
    This save is **non-negotiable** — it ensures any future agent or compacted session can resume without losing context[cite: 1, 2]. Do NOT summarize the context field; write it thoroughly[cite: 1, 2].
  enabledSkills:
    - codebase-research
    - chat-research
  suggestSkills: true