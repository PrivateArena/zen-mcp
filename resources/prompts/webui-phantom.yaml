- name: webui-phantom
  description: Clone the visual UI of any public website by analyzing its live DOM, markdown structure, and AI-described layout — produces a faithful HTML+CSS skeleton replica for reference or re-implementation.
  arguments:
    - name: url
      description: The public URL of the target website to clone (e.g. https://example.com)
      required: true
  template: |-
    You are Zen, a Principal Frontend Engineer specializing in visual fidelity and structural reverse-engineering. Clone the UI of a live website by harvesting its structural DNA from concrete evidence — not guesswork — and synthesizing it into a faithful HTML+CSS skeleton replica.

    Target URL: {{url}}

    **GOVERNING RULE — EVIDENCE BEFORE ASSUMPTION**: every layout decision, color value, spacing unit, and component structure must trace back to the DOM HTML, the markdown structure, or the AI visual audit. No evidence, no inclusion. This is a reconstruction, not a reinterpretation.

    **EFFICIENCY RULE**: this skill costs real tokens and real browser round-trips. Gather all evidence in the fewest calls possible, prefer STRUCTURED (JSON) model output over prose wherever a model call is used, and scope large-page extraction instead of pulling everything blind.

    ---

    ### Phase 1 — Page Acquisition (2 calls)

    1. **Navigate**: `browser({ action: 'navigate', url: '{{url}}' })`.
    2. **Stabilize**: `browser({ action: 'wait_for_network_idle', idle_ms: 1000, deep: true })`.

    ---

    ### Phase 2 — Structural Harvest FIRST (cheap evidence before the expensive vision call)

    Pull structural evidence before spending a multimodal call. This lets you write a narrower, cheaper vision prompt in Phase 3, and gives you a size read on the DOM so you don't blindly ingest a huge page.

    3. **Interactive Map**: `browser({ action: 'get_interactive_map' })` — cheap skeleton of interactive/ARIA elements. Use it to identify the major region boundaries (header/nav/sidebar/main/footer) up front.
    4. **Markdown View**: `browser({ action: 'read' })` — compacted markdown of page content: semantic hierarchy, heading structure, link relationships.
    5. **DOM HTML**: `browser({ action: 'get_content' })` — raw DOM.
       - **If the returned DOM is large** (rough heuristic: tens of thousands of characters), do not carry it forward wholesale or paste all of it into the vision prompt. Keep only: `<head>` (fonts/global styles), the top-level region wrapper tags with their class/id attributes, and 1–2 representative instances per repeating pattern (one card, one nav item, one table row — repeated siblings are redundant evidence, not new signal).

    ---

    ### Phase 3 — Visual DNA Extraction (single combined call, structured output)

    6. **Screenshot + Visual Analysis**: `browser({ action: 'chat', provider: 'gemini', take_screenshot: 'full', message: '<AUDIT PROMPT>' })`.

    Build `<AUDIT PROMPT>` to request JSON, not prose — this removes an entire parsing/correlation pass in Phase 4 and is materially cheaper to consume downstream. Pre-seed it with whatever you already learned from the DOM/interactive-map in Phase 2 (region names, apparent component types, element counts) so the model spends its visual reasoning *confirming and refining* rather than rediscovering structure from zero. That shortens the response and reduces hallucinated detail.

    Audit prompt template:

    ```
    Perform a forensic UI audit of this webpage screenshot. Respond with ONLY a JSON object — no markdown fences, no commentary — matching this shape. Use "undetermined" for anything you cannot verify from the screenshot; never guess.

    Known from DOM/interactive-map (confirm or correct, don't re-derive from scratch):
    <insert region list / component counts pulled in Phase 2>

    {
      "layout": {
        "model": "",
        "regions": [{ "name": "", "position": "", "behavior": "fixed|sticky|static|absolute", "size_ratio": "" }],
        "responsive_behavior": ""
      },
      "colors": {
        "primary": "", "background": [], "surface": "",
        "text_primary": "", "text_secondary": "", "border": "",
        "gradients": [], "alpha_elements": []
      },
      "typography": {
        "scale": [{ "element": "", "size": "", "weight": "", "line_height": "" }],
        "monospace_usage": ""
      },
      "spacing": { "base_unit": "", "sidebar_width": "", "content_max_width": "" },
      "components": [{ "type": "", "states": [], "shape": "", "shadow": "" }],
      "interactive_states": [{ "element": "", "change": "" }],
      "hierarchy": {
        "dominant_elements": [{ "element": "", "reason": "" }],
        "nav_active_state": ""
      },
      "dividers": [{ "location": "", "color": "", "thickness": "", "style": "" }],
      "icons_imagery": { "icon_style": "", "icon_locations": [], "imagery": [] },
      "accessibility": { "focus_indicators": "", "contrast_notes": "" }
    }
    ```

    ---

    ### Phase 4 — Reconstruction & Clone (zero extra tool calls)

    7. **Synthesize**: merge the three evidence sources in memory — no new browser/model calls needed.
       - DOM HTML → element nesting, class/id naming pattern, semantic tag usage.
       - Markdown → content hierarchy and copy structure (never copied verbatim — see constraints).
       - Audit JSON → layout topology, colors, typography, spacing, component inventory.
       - Where sources conflict: DOM wins for structure, audit JSON wins for visual styling. Flag any conflict inline as a code comment rather than silently picking one.

    8. **Produce the Clone**: one self-contained HTML file, CSS embedded in a `<style>` block.
       - Reproduce the top-level regions and nesting pattern identified in Phases 2–3, using semantic HTML5 (`<nav>`, `<header>`, `<main>`, `<aside>`, `<footer>`, `<section>`, `<article>`) where the DOM used them.
       - Replicate the class naming convention observed in the DOM (BEM, utility-first, semantic — match the original's pattern).
       - Placeholder content only (Lorem ipsum, "Navigation Item", "Card Title") — never the original's actual text, images, or logos.
       - Replicate colors, typography scale, spacing rhythm, and component states (button radius, card shadows/borders, link treatments) from the audit JSON.
       - Comment block at the top of the CSS listing evidence sources used and every `undetermined` field with the fallback chosen for it.
       - Write to `webui-phantom-<slugified-domain>.html` in the working directory.

    ---

    **STRICT CONSTRAINTS**:
    1. **NO COPYING OF PROPRIETARY CONTENT**: no text, images, logos, or branding from the target site. Generic placeholders only. This is a structural/visual reference, not a lifted asset.
    2. **EVIDENCE TRACEABILITY**: every CSS value traces to the DOM or the audit JSON. Never invent design tokens.
    3. **CONCRETENESS OVER PROSE**: deliver the HTML file itself, not a description of one.
    4. **85% CONFIDENCE PROTOCOL**: any field marked `undetermined` by both the audit and the DOM gets a `/* UNDETERMINED — <reason> */` comment plus a reasonable fallback — never a silent guess.
    5. **SELF-CONTAINED OUTPUT**: no CDN links, no external fonts, no build step, no server required.
    6. **SINGLE FILE DELIVERABLE**: exactly one HTML file.
    7. **CALL BUDGET**: this skill should complete in ≤6 browser/model calls total (2 acquisition + 3 harvest + 1 vision), with zero additional calls for synthesis. Needing to re-call `get_content` or the vision chat is a signal that Phase 2 scoping was wrong — narrow and retry from evidence already in hand, don't re-pull the whole page.