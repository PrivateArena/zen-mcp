- name: project-compact
  description: Save what changed this session to the project brain. Incremental — the tool already merges, dedupes, and archives for you.
  arguments:
    - name: i
      description: Memory filename (e.g. 'router', 'dsp'). Defaults to 'brain'.
      required: false
  template: |-
    Save this session's changes to project memory. You only need THIS session's delta — `title`/`objective` only if they changed, and full project history is handled by the timeline log, not by you re-deriving it.

    Write `notes` as ONE markdown block covering only this session. Use exactly these headers, and omit a section entirely if this session added nothing to it (don't write "N/A" or leave a header empty):

    ```
    ## Goal
    One line — only if new or changed from last time.

    ## Constraints & Preferences
    Anything that limits the solution space and would cause wasted work if forgotten.

    ## Progress
    ### Done
    Concrete, verifiable outcomes — not "worked on X" but what changed and what confirmed it worked.

    ### In Progress
    What's mid-flight, with enough detail to resume without re-reading code.

    ### Blocked
    What's stuck and why — the actual error/symptom. If something did NOT fix it, say so explicitly so it isn't retried.

    ## Key Decisions
    Choices made and why, especially ones a future session might otherwise redo differently.

    ## Next Steps
    Ordered, concrete next actions.

    ## Critical Context
    Non-obvious facts a fresh session needs before touching this again: root causes found, gotchas, log lines that confirmed/ruled out a hypothesis.

    ## Relevant Files
    Files touched or central to this work, one line each on what changed or why it matters.
    ```

    Write it as if you'll read it cold at the start of a brand-new session with zero other context — specific enough that nothing gets silently re-tried or re-derived.

    Then call `memory({ action: 'save', notes: <the markdown above>, title: <session title>, objective: <what we have achieved> })` — one call, sending only the fields that have real content this session.