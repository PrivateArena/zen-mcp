- name: populate-scope
  description: Analyze codebase architecture and automatically partition it into meaningful scopes, updating map.json.
  arguments:
    - name: i
      description: Optional guidance or focus areas for partitioning
      required: false
  template: |-
    Analyze the codebase architecture and partition it into meaningful scopes in `map.json` under the current workspace directory.

    **STRICT WORKFLOW**:
    1. **Map Architecture**: Call `codegraph({ action: 'map' })` to grasp top directories, languages, and core files.
    2. **Analyze Details**: Run `codegraph({ action: 'skeletons', query: '<top_files_or_directories>' })` to study the most frequently used or central files.
    3. **Partition Scopes**: Group related files/directories into 3-6 significant, meaningful modules (scopes). Follow any specific guidance: '{{i}}'.
    4. **Update map.json Safely**:
       - Check the absolute path of the current directory.
       - Update the `scopes` key in `map.json` under this directory path.
       - **WARNING**: `map.json` may be symlinked. DO NOT use `mv` to overwrite it, as this will break the symlink. Instead, use a temporary file and write back using `cat`, for example: `jq --arg pwd "$(pwd)" --argjson scopes '{"scope_a": ["path1"], "scope_b": ["path2"]}' '.[$pwd].scopes = $scopes' map.json > map.tmp && cat map.tmp > map.json && rm map.tmp`.
    5. **Verify**: Verify the updated `map.json` syntax and print the newly populated scopes.

    **MANDATORY FINAL STEP — Save Session Memory**:
    Before closing this task, call `memory({ action: 'save', name: 'brain', session_title: '<one-line summary of what was planned>', objective: '<what we set out to achieve>', what_is_done: '<concrete outcomes completed this session>', episodic: [{ text: '<event description>', outcome: '<concrete result>' }], semantic: { facts: [{ key: '<decision or note key>', value: '<rationale or value>' }], preferences: [] })`.
    This save is **non-negotiable** — it ensures any future agent or compacted session can resume without losing context. Do NOT summarize the context field; write it thoroughly.
